name: security-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic assessment smoke test
        run: |
          python src/cli.py data/synthetic_api_inventory.json --format markdown --output /tmp/api-assessment.md
          test -s /tmp/api-assessment.md
          grep -q "Remediation & Validation" /tmp/api-assessment.md
